[package]
name = "ljnljn-windows-registry"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "LovelyCarve LPP v2 analyzer: Windows registry SAM hashes, SOFTWARE version, Uninstall, USBSTOR and password policy"
publish = false

[lib]
name = "ljnljn_windows_registry"
crate-type = ["cdylib", "rlib"]

[dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk" }

[dev-dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk", features = ["testing"] }

[lints.rust]
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

[workspace]

[workspace.package]
license = "AGPL-3.0-only"
