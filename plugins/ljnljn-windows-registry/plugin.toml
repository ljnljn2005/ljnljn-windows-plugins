# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.windows-registry"
name = "Windows 注册表取证"
version = "0.1.0"
protocol = 2
library = "ljnljn_windows_registry"
memory = "2GiB"
permissions = []

# SAM + SYSTEM pairing. The evidence scope pairs the hives of every volume;
# the system scope does the same on one detected Windows system.
[[analyzer]]
id = "sam_accounts"
name = "SAM 账号与哈希"
scope = "evidence"
trigger = "manual"
category = "hash"
inputs = ["Windows/System32/config/SAM", "Windows/System32/config/SYSTEM"]

[[analyzer]]
id = "sam_accounts_system"
name = "SAM 账号与哈希（当前系统）"
scope = "system"
platforms = ["windows"]
trigger = "manual"
category = "hash"
inputs = ["Windows/System32/config/SAM", "Windows/System32/config/SYSTEM"]

[[analyzer]]
id = "software_version"
name = "SOFTWARE 系统版本"
scope = "system"
platforms = ["windows"]
trigger = "manual"
category = "software"
inputs = ["Windows/System32/config/SOFTWARE"]

[[analyzer]]
id = "software_version_file"
name = "系统版本（选定 SOFTWARE hive）"
scope = "files"
trigger = "manual"
category = "software"

[[analyzer]]
id = "uninstall"
name = "Uninstall 安装项"
scope = "system"
platforms = ["windows"]
trigger = "manual"
category = "software"
inputs = ["Windows/System32/config/SOFTWARE"]

[[analyzer]]
id = "uninstall_file"
name = "Uninstall 安装项（选定 SOFTWARE hive）"
scope = "files"
trigger = "manual"
category = "software"

[[analyzer]]
id = "usbstor"
name = "USBSTOR 设备"
scope = "system"
platforms = ["windows"]
trigger = "manual"
category = "usb"
inputs = ["Windows/System32/config/SYSTEM"]

[[analyzer]]
id = "usbstor_file"
name = "USBSTOR 设备（选定 SYSTEM hive）"
scope = "files"
trigger = "manual"
category = "usb"

[[analyzer]]
id = "password_policy"
name = "SAM 密码策略"
scope = "system"
platforms = ["windows"]
trigger = "manual"
category = "policy"
inputs = ["Windows/System32/config/SAM"]

[[analyzer]]
id = "password_policy_file"
name = "SAM 密码策略（选定 SAM hive）"
scope = "files"
trigger = "manual"
category = "policy"
