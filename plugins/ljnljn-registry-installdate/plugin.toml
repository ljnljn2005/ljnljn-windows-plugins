# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.registry-installdate"
name = "注册表 InstallDate 安装时间"
version = "0.1.0"
protocol = 2
library = "ljnljn_registry_installdate"
memory = "2GiB"
permissions = []

[[analyzer]]
id = "installdate"
name = "SOFTWARE 安装时间"
scope = "system"
platforms = ["windows"]
trigger = "manual"
category = "system"
inputs = ["Windows/System32/config/SOFTWARE"]

[[analyzer]]
id = "installdate_evidence"
name = "安装时间（全部卷的 SOFTWARE）"
scope = "evidence"
trigger = "manual"
category = "system"
inputs = ["Windows/System32/config/SOFTWARE"]

[[analyzer]]
id = "installdate_file"
name = "安装时间（选定 hive）"
scope = "files"
trigger = "manual"
category = "system"
