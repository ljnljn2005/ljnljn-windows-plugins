# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.chromium-history"
name = "Chromium 浏览历史"
version = "0.1.0"
protocol = 2
library = "ljnljn_chromium_history"
memory = "512MiB"
permissions = []

[[analyzer]]
id = "history"
name = "Chrome / Edge 历史（当前系统）"
scope = "system"
platforms = ["windows"]
trigger = "manual"
category = "browserinfo"
inputs = [
  "Users/*/AppData/Local/Google/Chrome/User Data/*/History",
  "Users/*/AppData/Local/Microsoft/Edge/User Data/*/History",
]

[[analyzer]]
id = "history_evidence"
name = "Chrome / Edge 历史（全部卷）"
scope = "evidence"
trigger = "manual"
category = "browserinfo"
inputs = [
  "Users/*/AppData/Local/Google/Chrome/User Data/*/History",
  "Users/*/AppData/Local/Microsoft/Edge/User Data/*/History",
]

[[analyzer]]
id = "history_file"
name = "历史（选定 History 数据库）"
scope = "files"
trigger = "manual"
category = "browserinfo"
