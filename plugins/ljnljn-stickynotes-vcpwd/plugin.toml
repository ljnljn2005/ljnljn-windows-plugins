# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.stickynotes-vcpwd"
name = "便笺 VCpwd 凭据提取"
version = "0.1.0"
protocol = 2
library = "ljnljn_stickynotes_vcpwd"
memory = "256MiB"
permissions = []

# A Sticky Notes CSV/TSV export selected by the user.
[[analyzer]]
id = "stickynotes_vcpwd"
name = "便笺 VCpwd 凭据"
scope = "files"
trigger = "manual"
category = "stickynotes"
extensions = ["csv", "tsv", "txt"]
mime_types = ["text/csv", "text/tab-separated-values", "text/plain"]
