# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.psreadline"
name = "PowerShell历史URL"
version = "0.1.0"
protocol = 2
library = "ljnljn_psreadline"
memory = "256MiB"
permissions = []

# A history file selected by the user (normally ConsoleHost_history.txt).
[[analyzer]]
id = "psreadline_files"
name = "PowerShell 历史 URL（单文件）"
scope = "files"
trigger = "manual"
category = "powershell"
extensions = ["txt"]
mime_types = ["text/plain"]

# The whole evidence item: standard user-profile PSReadLine history paths on
# every volume.
[[analyzer]]
id = "psreadline_evidence"
name = "PowerShell 历史 URL（检材）"
scope = "evidence"
trigger = "manual"
category = "powershell"
