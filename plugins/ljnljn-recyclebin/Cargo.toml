[package]
name = "ljnljn-recyclebin"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "LovelyCarve LPP v2 analyzer: Windows Vista+ recycle-bin $I metadata"
publish = false

[lib]
name = "ljnljn_recyclebin"
crate-type = ["cdylib", "rlib"]

[dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk" }

[dev-dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk", features = ["testing"] }

[lints.rust]
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

[workspace]

[workspace.package]
license = "AGPL-3.0-only"
