# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.recyclebin"
name = "Windows 回收站元数据"
version = "0.1.0"
protocol = 2
library = "ljnljn_recyclebin"
memory = "256MiB"
permissions = []

# One selected $I file. No extension filter: an $I file keeps the extension of
# the deleted file ($IABC123.txt, $IABC123.jpg, $IABC123), so any extension can
# be a valid recycle-bin metadata file.
[[analyzer]]
id = "recyclebin_files"
name = "回收站 $I 元数据（单文件）"
scope = "files"
trigger = "manual"
category = "recyclebin"

# The whole evidence item: every volume's $Recycle.Bin is scanned. Volume keys
# are the top-level directories of an evidence view (part:1, part:2, ...).
[[analyzer]]
id = "recyclebin_evidence"
name = "回收站记录（检材）"
scope = "evidence"
trigger = "manual"
category = "recyclebin"
