[package]
name = "ljnljn-qq-setup-log"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "LovelyCarve LPP v2 analyzer: Tencent QQ qq_setup.log timeline fragments"
publish = false

[lib]
name = "ljnljn_qq_setup_log"
crate-type = ["cdylib", "rlib"]

[dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk" }
encoding_rs = "0.8"

[dev-dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk", features = ["testing"] }

[lints.rust]
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

[workspace]

[workspace.package]
license = "AGPL-3.0-only"
