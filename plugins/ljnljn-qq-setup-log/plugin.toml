# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.qq-setup-log"
name = "QQ安装日志时间片段"
version = "0.1.0"
protocol = 2
library = "ljnljn_qq_setup_log"
memory = "512MiB"
permissions = []

# A qq_setup.log (or any similarly shaped text log) selected by the user.
[[analyzer]]
id = "qq_setup_log"
name = "QQ 安装日志时间片段"
scope = "files"
trigger = "manual"
category = "qq"
extensions = ["log", "txt"]
mime_types = ["text/plain"]
