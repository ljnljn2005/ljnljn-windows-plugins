# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.bitlocker-vhd"
name = "BitLocker VHD/VHDX 识别"
version = "0.1.0"
protocol = 2
library = "ljnljn_bitlocker_vhd"
memory = "512MiB"
permissions = []

# A VHD/VHDX image (or any disk image) selected by the user. The extension
# list is a candidate hint; the analyzer still inspects the bytes.
[[analyzer]]
id = "bitlocker_vhd"
name = "BitLocker VHD/VHDX 识别"
scope = "files"
trigger = "manual"
category = "bitlocker"
extensions = ["vhd", "vhdx"]
mime_types = ["application/x-vhd", "application/x-vhdx", "application/octet-stream"]
